# Build Maze Sequencer (sequencer/) into a DRAFT release (maze-sequencer-vst-v<version>) with mpc-vst-plugins' shared
# workflow: Actions -> "VST release (draft)" -> Run workflow. Then install that draft's zip on a
# device, smoke-test it, and publish the draft (see mpc-vst-plugins docs/RELEASING.md).
# dry_run builds the zip and skin previews as run artifacts only.
name: VST release - Maze Sequencer (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.0
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  maze-sequencer:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@b6e2197731fc7cc4dd491d34c4a83c4348c3babc
    permissions:
      contents: write
    with:
      tag: maze-sequencer-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: b6e2197731fc7cc4dd491d34c4a83c4348c3babc
      vst_dir: sequencer/vst
      plugin_id: maze-sequencer
      license: MIT
      build: SHADOW_SKIN_MPC_OS=2 bash sequencer/vst/build.sh
      host_test: sequencer/vst/test.sh
      about: Dual 8-step generative sequencer (Moog Labyrinth style) with corrupt, scale quantising, two LFOs and per-line MIDI channels, driving other tracks over MIDI.
      dry_run: ${{ inputs.dry_run }}
