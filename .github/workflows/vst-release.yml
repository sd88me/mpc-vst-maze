# Build Maze Voice into a DRAFT release (maze-voice-vst-v<version>) with mpc-vst-plugins' shared
# workflow: Actions -> "VST release (draft)" -> Run workflow. Then install that draft's zip on a
# device, smoke-test it, and publish the draft (see mpc-vst-plugins docs/RELEASING.md).
# dry_run builds the zip and skin previews as run artifacts only.
name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.1
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  maze-voice:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@b6e2197731fc7cc4dd491d34c4a83c4348c3babc
    permissions:
      contents: write
    with:
      tag: maze-voice-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: b6e2197731fc7cc4dd491d34c4a83c4348c3babc
      vst_dir: vst
      plugin_id: maze-voice
      license: MIT
      build: SHADOW_SKIN_MPC_OS=2 bash vst/build.sh
      host_test: '"$MPC_VST/tools/test_port.sh" vst/vst.json'
      about: Monophonic Moog Labyrinth-style thru-zero oscillator / wavefolder / state-variable filter voice, with two LFOs and a page randomiser.
      dry_run: ${{ inputs.dry_run }}
