# Maze Voice MPC skin layout: the Force Shadow page (force-maze: maze-voice/addon/shadow_page.conf)
# rebuilt as a native MPC plugin skin by shadow_skin.py. Same coordinates and
# widget syntax. Differences from the shadow page:
#   - no DEST / GAIN (host-level mixer controls, not plugin parameters)
#   - LFO SYNC DIV shows all 8 divisions (two rows)
#   - qlinks lines: nested MPC pages sharing one design, each with its own Q-Links
#     (1-8 = knob bank 1, 9-16 = bank 2)

[tab VOICE]
frame x=36 y=88 w=430 h=624 title="OSCILLATOR"
frame x=486 y=88 w=260 h=624 title="ENVELOPES"
frame x=766 y=88 w=477 h=624 title="MIXER / TONE"
knob cx=96 cy=232 r=39 label="VCO TUNE" key=vco_tune
knob cx=251 cy=232 r=39 label="VCO EG1" key=vco_eg1
knob cx=406 cy=232 r=39 label="VCO KEY" key=vco_key
knob cx=96 cy=420 r=39 label="MOD FREQ" key=mod_freq
knob cx=251 cy=420 r=39 label="MOD EG1" key=mod_eg1
knob cx=406 cy=420 r=39 label="MOD KEY" key=mod_key
knob cx=96 cy=608 r=39 label="FM DEPTH" key=fm_depth
knob cx=251 cy=608 r=39 label="FM EG1" key=fm_eg1
knob cx=616 cy=232 r=45 label="ENV1 DEC" key=env1_decay
knob cx=616 cy=420 r=45 label="VCA DECAY" key=env2_decay
knob cx=850 cy=170 r=36 label="VCO LVL" key=vco_lvl
knob cx=1004 cy=170 r=36 label="MOD LVL" key=mod_lvl
knob cx=1158 cy=170 r=36 label="RING LVL" key=ring_lvl
knob cx=850 cy=312 r=36 label="NOISE TONE" key=noise_tone
knob cx=1004 cy=312 r=36 label="NOISE LVL" key=noise_lvl
knob cx=1158 cy=312 r=36 label="TONE/SAT" key=sat
knob cx=850 cy=454 r=36 label="OUT LEVEL" key=level
enum_h cx=1040 cy=454 label="VOICE MODE" key=out_mode options="INTERNAL,EXTERNAL"
qlinks "VOICE" = vco_tune,vco_eg1,vco_key,mod_freq,mod_eg1,mod_key,fm_depth,fm_eg1,env1_decay,env2_decay,vco_lvl,mod_lvl,ring_lvl,noise_lvl,sat,level

[tab WAVEFOLDER / FILTER]
frame x=36 y=88 w=514 h=624 title="WAVEFOLDER"
frame x=730 y=88 w=514 h=624 title="FILTER"
knob cx=164 cy=281 r=42 label="FOLD DRIVE" key=fold_drive
knob cx=421 cy=281 r=42 label="FOLD BIAS" key=fold_bias
knob cx=164 cy=568 r=42 label="FOLD EG1" key=fold_eg1
knob cx=421 cy=568 r=42 label="FOLD KEY" key=fold_key
enum_v cx=640 cy=310 label="ROUTE" key=route options="VCW>VCF,PARALLEL,VCF>VCW"
knob cx=640 cy=470 r=42 label="BLEND" key=blend
knob cx=858 cy=233 r=39 label="CUTOFF" key=cutoff
knob cx=1115 cy=233 r=39 label="RESONANCE" key=reso
knob cx=858 cy=424 r=39 label="LP-BP" key=filter_mode
knob cx=1115 cy=424 r=39 label="CUT EG1" key=cutoff_eg1
knob cx=858 cy=615 r=39 label="CUT KEY" key=cutoff_key
knob cx=1115 cy=615 r=39 label="FILT DRIVE" key=filt_drive
qlinks "FOLD / FILTER" = fold_drive,fold_bias,fold_eg1,fold_key,route,blend,filt_drive,filter_mode,cutoff,reso,cutoff_eg1,cutoff_key

[tab MOD / RANDOM]
frame x=36 y=88 w=1207 h=130 title="RANDOMISE"
toggle cx=170 cy=165 label="RND VOICE" key=rnd_voice
toggle cx=400 cy=165 label="RND FOLD" key=rnd_wavefolder
toggle cx=630 cy=165 label="RND FILT" key=rnd_filter
toggle cx=860 cy=165 label="RND TONE" key=rnd_tone
button cx=1085 cy=165 label="GENERATE" key=rnd_go
frame x=36 y=232 w=595 h=480 title="LFO 1"
enum_h cx=221 cy=324 label="SHAPE" key=lfo1_shape options="SAW,TRI,SIN,SQR,S/H" sw=52
popup cx=221 cy=404 w=200 h=44 label="SYNC DIV" key=lfo1_div options="16TH,8TH,4TH,HALF,1BAR,2BAR,4BAR,8BAR"
knob cx=464 cy=367 r=30 label="RATE" key=lfo1_rate
toggle cx=576 cy=340 label="SYNC" key=lfo1_sync
toggle cx=576 cy=410 label="RETRIG" key=lfo1_retrig
knob cx=126 cy=522 r=28 label="VCO PITCH" key=lfo1_vco_pitch
knob cx=264 cy=522 r=28 label="MOD PITCH" key=lfo1_mod_pitch
knob cx=402 cy=522 r=28 label="FM DEPTH" key=lfo1_fm_depth
knob cx=540 cy=522 r=28 label="CUTOFF" key=lfo1_cutoff
knob cx=126 cy=630 r=28 label="ENV1 DEC" key=lfo1_env1_decay
knob cx=264 cy=630 r=28 label="ENV2 DEC" key=lfo1_env2_decay
knob cx=402 cy=630 r=28 label="FOLD AMT" key=lfo1_fold_amt
knob cx=540 cy=630 r=28 label="FOLD BIAS" key=lfo1_fold_bias
frame x=648 y=232 w=595 h=480 title="LFO 2"
enum_h cx=833 cy=324 label="SHAPE" key=lfo2_shape options="SAW,TRI,SIN,SQR,S/H" sw=52
popup cx=833 cy=404 w=200 h=44 label="SYNC DIV" key=lfo2_div options="16TH,8TH,4TH,HALF,1BAR,2BAR,4BAR,8BAR"
knob cx=1076 cy=367 r=30 label="RATE" key=lfo2_rate
toggle cx=1188 cy=340 label="SYNC" key=lfo2_sync
toggle cx=1188 cy=410 label="RETRIG" key=lfo2_retrig
knob cx=738 cy=522 r=28 label="VCO PITCH" key=lfo2_vco_pitch
knob cx=876 cy=522 r=28 label="MOD PITCH" key=lfo2_mod_pitch
knob cx=1014 cy=522 r=28 label="FM DEPTH" key=lfo2_fm_depth
knob cx=1152 cy=522 r=28 label="CUTOFF" key=lfo2_cutoff
knob cx=738 cy=630 r=28 label="ENV1 DEC" key=lfo2_env1_decay
knob cx=876 cy=630 r=28 label="ENV2 DEC" key=lfo2_env2_decay
knob cx=1014 cy=630 r=28 label="FOLD AMT" key=lfo2_fold_amt
knob cx=1152 cy=630 r=28 label="FOLD BIAS" key=lfo2_fold_bias
qlinks "LFO 1" = lfo1_shape,lfo1_rate,lfo1_sync,lfo1_div,lfo1_retrig,lfo1_vco_pitch,lfo1_mod_pitch,lfo1_fm_depth,lfo1_cutoff,lfo1_env1_decay,lfo1_env2_decay,lfo1_filt_drive,lfo1_fold_amt,lfo1_fold_bias,rnd_go
qlinks "LFO 2" = lfo2_shape,lfo2_rate,lfo2_sync,lfo2_div,lfo2_retrig,lfo2_vco_pitch,lfo2_mod_pitch,lfo2_fm_depth,lfo2_cutoff,lfo2_env1_decay,lfo2_env2_decay,lfo2_filt_drive,lfo2_fold_amt,lfo2_fold_bias,rnd_go
